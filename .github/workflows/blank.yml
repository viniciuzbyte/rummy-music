name: Rummy Debug Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      METROLIST_APPLICATION_ID: com.rummy.music
      METROLIST_APP_NAME: Rummy
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q Metrolist-13.7.0-rumm*.zip

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build FOSS debug APK
        working-directory: Metrolist-13.7.0
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleFossDebug --warning-mode summary

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rummy-music-debug
          path: Metrolist-13.7.0/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
